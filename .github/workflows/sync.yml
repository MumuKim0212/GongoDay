name: 정책 수집 (수동)

# **평소 트리거는 여기가 아니라 Supabase pg_cron이다** (`supabase/cron.sql`).
#
# 이 워크플로가 `*/20`(나중엔 `7,27,47`) 스케줄로 돌 때 실제로는 3~7시간 간격, 하루 4~5번만 실행됐다
# (`sync_runs` 실측). GitHub는 schedule 이벤트를 부하에 따라 미루거나 버리고, 레포가 60일간 조용하면
# 아예 끈다. 그 사이 정부24 한 바퀴가 2~3일로 늘어 하루 수정 353건 중 47건만 반영됐다.
#
# 여기 남긴 것은 **손으로 한 번 돌려볼 때**뿐이다 — pg_cron과 같은 순서(두 소스 → 알림)로 한 번 친다.
# 스케줄을 다시 넣지 말 것: pg_cron과 겹치면 같은 `last_page`를 둘이 읽어 API 호출만 두 배가 된다.

on:
  workflow_dispatch:

# 앞 실행이 아직 돌고 있으면 겹치지 않게 한다 — 같은 `last_page`를 둘이 읽으면 API 호출만 두 배다.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SYNC_URL: ${{ vars.SYNC_URL || 'https://gongoday.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: 온통청년
        run: |
          curl --fail-with-body -sS --max-time 120 -X POST "$SYNC_URL/api/sync" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"source":"youth"}'

      # 한 소스가 실패해도 다른 소스는 받는다 (ARCHITECTURE §4.3).
      - name: 정부24
        if: always()
        run: |
          curl --fail-with-body -sS --max-time 120 -X POST "$SYNC_URL/api/sync" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"source":"gov24"}'

      # 두 소스 중 하나라도 새 정책을 넣었으면 알림 대상이다. 실패해도 다음 정각의 커서 이어받기가
      # 있으니(§11) 이 스텝의 실패가 sync 결과를 되돌리지 않는다.
      - name: 텔레그램 알림
        if: always()
        run: |
          curl --fail-with-body -sS --max-time 120 -X POST "$SYNC_URL/api/notify" \
            -H "Authorization: Bearer $CRON_SECRET"
