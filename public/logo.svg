<svg width="160" height="160" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">

    <rect
        x="14"
        y="14"
        width="100"
        height="100"
        rx="10"
        fill="white"
        stroke="#E2E8F0"
        stroke-width="2"/>

    <circle
        cx="64"
        cy="64"
        r="40"
        fill="#2563EB"/>

    <circle
        cx="64"
        cy="64"
        r="23"
        fill="white"/>

    <circle
        cx="64"
        cy="64"
        r="10"
        fill="#2563EB"/>

    <!-- Pencil, from upper-right into the bullseye, pivoted around the tip -->
    <g transform="rotate(45 64 64)">

        <!-- Eraser -->
        <rect x="58" y="-4" width="12" height="10" rx="2" fill="#F472B6"/>

        <!-- Ferrule (metal band) -->
        <rect x="58" y="6" width="12" height="6" fill="#CBD5E1"/>

        <!-- Body -->
        <rect x="58" y="12" width="12" height="42" fill="#FDBA12"/>

        <!-- Sharpened wood -->
        <path d="M 58 54 L 70 54 L 64 66 Z" fill="#EAC08A"/>

        <!-- Graphite tip at the bullseye -->
        <path d="M 61.5 62 L 66.5 62 L 64 68 Z" fill="#3F2A17"/>

    </g>

</svg>
